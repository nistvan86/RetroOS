set timeout=3
set default=0

insmod part_msdos
insmod ext2
insmod multiboot

terminal_output console

menuentry "RetroOS (native VGA / BIOS)" {
    search --no-floppy --file /boot/retroos/kernel.elf --set=root
    terminal_output console
    multiboot /boot/retroos/kernel.elf
    boot
}

menuentry "RetroOS (GRUB framebuffer)" {
    search --no-floppy --file /boot/retroos/kernel.elf --set=root
    insmod all_video
    multiboot /boot/retroos/kernel.elf
    # The EGA-preferring Multiboot header sets gfxpayload=text while the
    # command above loads the ELF. Override it afterwards, immediately before
    # GRUB performs the final video-mode handoff.
    set gfxpayload=auto
    boot
}
