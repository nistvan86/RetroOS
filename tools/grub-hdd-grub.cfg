set timeout=3
set default=0

insmod part_msdos
insmod ext2
insmod multiboot

terminal_output console

menuentry "RetroOS" {
    search --no-floppy --file /boot/retroos/kernel.elf --set=root
    # Upstream's single Multiboot header prefers EGA text. On BIOS GRUB this
    # keeps the real VGA card active; on firmware without text support GRUB
    # may still fall back to a linear framebuffer.
    multiboot /boot/retroos/kernel.elf
    boot
}
